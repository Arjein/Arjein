    <text x="40" y="124" font-size="15" fill="#57606A">Turn-based elemental brick-breaker for iPhone and iPad.</text><text x="40" y="147" font-size="15" fill="#57606A">Pure-Dart rules core with deterministic ball physics,</text><text x="40" y="170" font-size="15" fill="#57606A">custom GLSL shaders and 169 tests, in 10 languages.</text>
