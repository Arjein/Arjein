<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363D"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="18"/></clipPath>
    <style>
      .fade { animation: fadein .9s ease-out both; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .line { animation: appear .01s linear both; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      .blink, .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <rect width="1200" height="330" fill="#0D1117"/>
    <rect width="1200" height="330" fill="url(#dots)"/>
    
    <g class="fade d2">
      <rect x="700" y="44" width="440" height="244" rx="12" fill="#161B22" stroke="#30363D"/>
      <rect x="700" y="44" width="440" height="36" rx="12" fill="#30363D" fill-opacity="0.35"/>
      <rect x="700" y="68" width="440" height="12" fill="#161B22"/>
      <line x1="700" y1="80" x2="1140" y2="80" stroke="#30363D"/>
      <circle cx="720" cy="62" r="6" fill="#FF5A5F"/>
