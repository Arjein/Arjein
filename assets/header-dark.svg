      <text class="line" style="animation-delay:0.60s" x="724" y="120" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#FFFFFF">whoami</tspan></text><text class="line" style="animation-delay:1.05s" x="724" y="144" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#9BA3AE">mert, software engineer</tspan></text><text class="line" style="animation-delay:1.50s" x="724" y="176" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#FFFFFF">cat stack.txt</tspan></text><text class="line" style="animation-delay:1.95s" x="724" y="200" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#9BA3AE">flutter · sveltekit · bun · pytorch</tspan></text><text class="line" style="animation-delay:2.40s" x="724" y="232" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#FFFFFF">./ship --end-to-end</tspan></text><text class="line" style="animation-delay:2.85s" x="724" y="256" font-size="15.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" xml:space="preserve"><tspan fill="#2DD4BF">✓ app   </tspan><tspan fill="#FFC53D">✓ api   </tspan><tspan fill="#4C8DFF">✓ infra   </tspan><tspan fill="#FF5A5F">✓ ml</tspan></text>
      <rect class="cursor" x="724" y="270" width="9" height="3" fill="#FF5A5F"/>
    </g>
    <g class="fade">
      <rect x="72" y="84" width="10" height="24" rx="2" fill="#FF5A5F"/>
      <text x="94" y="104" font-size="15" letter-spacing="4" font-weight="700" fill="#9BA3AE" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">HELLO, I'M<tspan class="blink" fill="#FF5A5F"> _</tspan></text>
    </g>
    <text class="fade d1" x="68" y="178" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Mert Arcan<tspan fill="#FF5A5F">.</tspan></text>
    <text class="fade d2" x="72" y="220" font-size="26" font-weight="600" fill="#FFFFFF">Software Engineer</text>
