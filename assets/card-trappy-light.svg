    <text x="40" y="60" font-size="26" font-weight="700" fill="#111418">Trappy: Mind the Trap</text>
    <text x="40" y="90" font-size="13.5" font-weight="600" fill="#E5A000" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">Flutter · Flame · Dart · PostgreSQL · SvelteKit</text>
    <text x="40" y="124" font-size="15" fill="#57606A">Multiplayer puzzle game: escape fog-of-war rooms, then</text><text x="40" y="147" font-size="15" fill="#57606A">leave a trap for the next player. Server-authoritative</text><text x="40" y="170" font-size="15" fill="#57606A">rules shared by the app and the server, in 5 languages.</text>
